name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "bandit[toml]>=1.8.0,<2"

      - name: Run Bandit security scan
        run: |
          if [ -f .bandit ]; then
            bandit -r app -c .bandit -ll
          else
            bandit -r app -ll -x venv,.venv,vector_db,experiments,data_pipeline -s B101
          fi

      - name: Compile Python sources
        env:
          PYTHONPATH: .
        run: python -m compileall -q app

      - name: Smoke import FastAPI app
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ci-dummy-key
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite+aiosqlite:///./ci-smoke.db
          VECTOR_DB_PATH: ./vector_db
        run: python -c "from app.main import app; assert app is not None"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file for compose
        run: cp backend/.env.example backend/.env

      - name: Validate compose file
        run: docker compose config --quiet
